theme  = "smarty"
layout = "layout"
cover  = "smarty"

; Режим отладки: on = подробные ошибки, off = общее сообщение
debug = "on"

; CSRF защита: on = включена, off = отключена
csrf_enabled = "on"

; Защитные HTTP-заголовки (укажите 0 чтобы отключить)
x_frame_options = "DENY"
x_content_type_options = "nosniff"
referrer_policy = "strict-origin-when-cross-origin"
